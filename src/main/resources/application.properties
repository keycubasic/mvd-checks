quarkus.ssl.native=false

# datastore
passports.expired.list.file.url=https://xn--b1agjhrfhd.xn--b1ab2a0a.xn--b1aew.xn--p1ai/upload/expired-passports
passports.expired.list.file.name=list_of_expired_passports.csv
passports.expired.list.file.path=D:\\Caustic\\Projects\\mvd-checks\\storage
passports.expired.list.file.archive.type=.bz2
passports.expired.list.split.path=${passports.expired.list.file.path}\\split
%dev.passports.expired.list.split.size=100000000

%prod.quarkus.devservices.enabled=false

# vert.x
quarkus.vertx.max-worker-execute-time=1H

# smallrye
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# datasource
quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=1
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mvd_db

# transaction
quarkus.transaction-manager.default-transaction-timeout=PT1H

# hibernate
quarkus.hibernate-orm.database.generation=none
%dev.quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-search-orm.schema-management.strategy=create-or-validate
quarkus.hibernate-search-orm.elasticsearch.version=7.17
%prod.quarkus.hibernate-search-orm.elasticsearch.hosts=es1.mycompany.com:9200
%dev.quarkus.hibernate-search-orm.automatic-indexing.synchronization.strategy=sync
mass-index.on-startup=false
%dev.mass-index.on-startup=true
%test.mass-index.on-startup=true

# scheduler
quarkus.scheduler.metrics.enabled=true
quarkus.scheduler.cron-type=unix

# cron
reload.cron.expr=0 0 * * *
persist.cron.expr=0 1-22 * * *
delete.cron.expr=0 23 * * *
persistTest.cron.expr=off

